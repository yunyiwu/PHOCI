name: phoci
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - pip:
      # Step 2: Build tools
      - setuptools
      - wheel
      # Step 3: PyTorch (CUDA 11.7)
      - torch==2.0.1
      - torchvision==0.15.2
      - torchaudio==2.0.2
      # Step 4: Data Science & Notebook
      - pandas==1.5.3
      - numpy==1.24.3
      - scipy==1.10.1
      - scikit-learn==1.3.2
      - matplotlib==3.7.2
      - seaborn==0.12.2
      - h5py==3.11.0
      - notebook==6.5.7
      # Step 5: PyG & C++ Extensions
      - torch-geometric==2.5.2
      - --find-links https://data.pyg.org/whl/torch-2.0.0+cu117.html
      - torch-scatter==2.1.2+pt20cu117
      - torch-sparse==0.6.18+pt20cu117
      - torch-cluster==1.6.3+pt20cu117
      - torch-spline-conv==1.2.2+pt20cu117
      # Step 6: 3D Genomics / Hi-C Analysis
      - cooler==0.9.3
      - bioframe==0.3.3
      - pybigwig==0.3.22
      - pyfaidx==0.8.1.2
      - trackc==0.0.18
      # Cooltools (PyPI default, or local wheel for Linux if needed):
      - cooltools==0.7.1
      # - ./third_party_packages/cooltools-0.7.1-cp38-cp38-linux_x86_64.whl
      # PyRanges compilation dependencies (Linux local wheels option if PyPI build fails):
      # - ./third_party_packages/ncls-0.0.71-cp38-cp38-linux_x86_64.whl
      # - ./third_party_packages/sorted_nearest-0.0.42-cp38-cp38-linux_x86_64.whl
      - pyranges
      # Hic-straw (PyPI default, or local wheel for Linux if needed):
      - hic-straw==1.3.1
      # - ./third_party_packages/hic_straw-1.3.1-cp38-cp38-linux_x86_64.whl
      # Step 7: Utilities
      - torchmetrics==1.4.1
      - lightning-utilities==0.11.6
      - aiohttp==3.10.3
      - pyyaml==6.0.2
      - tqdm==4.66.5
      - efficient-apriori==2.0.5
